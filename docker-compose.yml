version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wanderlust-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DB_URL=mongodb://mongo:27017/wonderlust
      - SESSION_SECRET=production_cluster_session_secret_replace_in_env
    volumes:
      - app-uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - wanderlust-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:7.0-jammy
    container_name: wanderlust-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - wanderlust-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  wanderlust-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  app-uploads:
    driver: local
