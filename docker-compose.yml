services:
  app:
    image: wander-lust:${WANDERLUST_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wanderlust-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - NODE_ENV=production
      - PORT=8080
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - MONGO_URL=${MONGO_URL:?Set authenticated TLS MongoDB connection string in environment}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in environment}@redis:6379}
      - RATE_LIMIT_STORE=${RATE_LIMIT_STORE:-redis}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_API=${RATE_LIMIT_MAX_API:-500}
      - RATE_LIMIT_MAX_AUTH=${RATE_LIMIT_MAX_AUTH:-20}
      - SESSION_SECRET=${SESSION_SECRET:?Set strong SESSION_SECRET in environment before running docker compose}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      # External managed MongoDB (Atlas) enforces TLS; set MONGO_REQUIRE_TLS=false only for internal bridge mongo without TLS
      - MONGO_REQUIRE_TLS=${MONGO_REQUIRE_TLS:-true}
      - PAYMENT_GATEWAY_MODE=${PAYMENT_GATEWAY_MODE:-strict}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-razorpay}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:?Set strong PAYMENT_WEBHOOK_SECRET in environment before running docker compose}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - PENDING_BOOKING_TTL_MINUTES=${PENDING_BOOKING_TTL_MINUTES:-15}
      - BOOKING_EXPIRY_SWEEP_INTERVAL_MS=${BOOKING_EXPIRY_SWEEP_INTERVAL_MS:-60000}
      - HEALTH_CHECK_TOKEN=${HEALTH_CHECK_TOKEN:-}
      - REQUIRE_VERIFIED_STAY_REVIEWS=${REQUIRE_VERIFIED_STAY_REVIEWS:-true}
    volumes:
      - app-uploads:/app/public/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wanderlust-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:7.0-jammy
    container_name: wanderlust-mongo
    restart: unless-stopped
    expose:
      - "27017"
    security_opt:
      - no-new-privileges:true
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-wanderlust_admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:?Set strong MONGO_INITDB_ROOT_PASSWORD before running docker compose}
    volumes:
      - mongo-data:/data/db
    networks:
      - wanderlust-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: wanderlust-redis
    restart: unless-stopped
    user: "999:1000"
    expose:
      - "6379"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set strong REDIS_PASSWORD before running docker compose}
    volumes:
      - redis-data:/data
    networks:
      - wanderlust-network
    healthcheck:
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    container_name: wanderlust-nginx
    restart: unless-stopped
    profiles:
      - proxy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./nginx/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_CERTS_DIR:-./nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - wanderlust-network

networks:
  wanderlust-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
  app-uploads:
    driver: local
