version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wonderlust-dev-app
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - DB_URL=mongodb://mongo:27017/wonderlust
      - SESSION_SECRET=development_session_secret_code
    volumes:
      - .:/app
      - /app/node_modules
      - app-dev-uploads:/app/public/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - wonderlust-dev-network
    command: ["node", "--watch", "server.js"]

  mongo:
    image: mongo:7.0-jammy
    container_name: wonderlust-dev-mongo
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-dev-data:/data/db
    networks:
      - wonderlust-dev-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  wonderlust-dev-network:
    driver: bridge

volumes:
  mongo-dev-data:
    driver: local
  app-dev-uploads:
    driver: local
